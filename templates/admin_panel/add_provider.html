{% extends "admin_panel/base.html" %}
{% block content %}

<div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4 gap-2">
  <div>
    <h2 class="h4 mb-1">Yeni Teminci Ekle</h2>
    <p class="text-muted mb-0">Sahaya yeni bir teminci ekleyin, komisyon ve limit ayarlarını belirleyin.</p>
  </div>
</div>

<div class="row">
  <div class="col-lg-6">
    <div class="card shadow-sm border-0">
      <div class="card-body">
        <form method="post" novalidate>
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label">Adı</label>
            <input type="text" name="name" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Kullanıcı Adı</label>
            <input type="text" name="username" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Şifre</label>
            <input type="password" name="password" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Telefon</label>
            <input type="text" name="phone" class="form-control" placeholder="0 5xx xxx xx xx">
          </div>

          <div class="row g-3">
            <div class="col-md-6">
              <div class="mb-3">
                <label class="form-label">Yatırım Komisyonu (%)</label>
                <input type="number" step="0.1" name="deposit_commission" class="form-control" placeholder="Örn: 5.0">
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label class="form-label">Çekim Komisyonu (%)</label>
                <input type="number" step="0.1" name="withdraw_commission" class="form-control" placeholder="Örn: 4.0">
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Limitor (TL)</label>
            <input type="number" step="0.01" name="limitor" class="form-control" placeholder="Limitsiz için boş bırakın">
            <div class="form-text">Onaylı + bekleyen yatırımlar bu limiti aştığında temincinin tüm banka hesapları otomatik pasife düşer.</div>
          </div>

          <div class="d-flex justify-content-end gap-2">
            <a href="{% url 'admin_panel:provider_list' %}" class="btn btn-outline-secondary btn-sm">İptal</a>
            <button type="submit" class="btn btn-primary btn-sm">Kaydet</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
