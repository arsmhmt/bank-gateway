{% extends "admin_panel/base.html" %}
{% block content %}
<div class="page-wrapper">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
        <div>
            <h2 class="page-title mb-0">{{ site.name }} · {{ gateway_config.get_gateway_display }}</h2>
            <p class="text-muted small mb-0">Bu gateway için erişim durumunu güncelleyin.</p>
        </div>
        <a href="{% url 'admin_panel:site_gateway_list' site.id %}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Geri
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="form-check form-switch mb-4">
                    <input class="form-check-input" type="checkbox" role="switch" id="isEnabledSwitch" name="is_enabled" {% if gateway_config.is_enabled %}checked{% endif %}>
                    <label class="form-check-label fw-semibold" for="isEnabledSwitch">
                        Gateway'i {% if gateway_config.is_enabled %}aktif{% else %}pasif{% endif %} yap
                    </label>
                </div>
                <button type="submit" class="btn btn-primary">
                    Kaydet
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
