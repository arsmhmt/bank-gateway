{% extends "base.html" %}
{% block content %}
<h2>Şifre Sıfırlama</h2>
<p>Kayıtlı email adresinizi girin, size şifre sıfırlama bağlantısı göndereceğiz.</p>
<form method="post">
  {% csrf_token %}
  {{ form.email.label_tag }}<br>
  {{ form.email }}
  <button type="submit">Bağlantı Gönder</button>
</form>
{% endblock %}
