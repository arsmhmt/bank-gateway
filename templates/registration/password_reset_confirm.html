{% extends "base.html" %}
{% block content %}
<h2>Yeni Şifre Belirleyin</h2>
{% if validlink %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Şifreyi Güncelle</button>
  </form>
{% else %}
  <p>Bu şifre sıfırlama bağlantısı geçersiz veya süresi dolmuş.</p>
{% endif %}
{% endblock %}
